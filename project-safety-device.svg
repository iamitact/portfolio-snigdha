<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Diagram of a wearable women safety device with health sensors, GPS, GSM and an IoT server">
  <rect width="800" height="600" fill="#F1EDE4"/>

  <!-- wrist band -->
  <g stroke="#152A40" fill="none" stroke-width="1.6">
    <path d="M300 168 C246 196 246 404 300 432"/>
    <path d="M500 168 C554 196 554 404 500 432"/>
  </g>

  <!-- device body -->
  <rect x="300" y="222" width="200" height="156" fill="#152A40"/>
  <rect x="316" y="238" width="168" height="124" fill="#FFFFFF"/>

  <!-- ecg trace -->
  <polyline points="330,312 356,312 366,286 378,336 390,300 402,312 470,312"
            fill="none" stroke="#A35318" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="1.6" fill="#8E8E82">
    <text x="330" y="266">BPM · SpO2 · TEMP</text>
    <text x="330" y="348">NODEMCU</text>
  </g>

  <!-- sensor nodes, left -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="1.6" text-anchor="end">
    <line x1="150" y1="250" x2="246" y2="250" stroke="#C9C2B4" stroke-width="1.2"/>
    <line x1="150" y1="300" x2="246" y2="300" stroke="#C9C2B4" stroke-width="1.2"/>
    <line x1="150" y1="350" x2="246" y2="350" stroke="#C9C2B4" stroke-width="1.2"/>
    <circle cx="150" cy="250" r="6" fill="#152A40"/>
    <circle cx="150" cy="300" r="6" fill="#152A40"/>
    <circle cx="150" cy="350" r="6" fill="#152A40"/>
    <text x="134" y="255" fill="#152A40">Heart rate</text>
    <text x="134" y="305" fill="#152A40">Oxygen  SpO2</text>
    <text x="134" y="355" fill="#152A40">Temperature</text>
  </g>

  <!-- wireless waves, right -->
  <g stroke="#A35318" fill="none" stroke-width="1.6">
    <path d="M556 282 A26 26 0 0 1 556 318"/>
    <path d="M572 268 A44 44 0 0 1 572 332"/>
    <path d="M588 254 A62 62 0 0 1 588 346"/>
  </g>

  <!-- server / cloud -->
  <rect x="620" y="188" width="128" height="72" fill="#FFFFFF" stroke="#152A40" stroke-width="1.4"/>
  <g font-family="Helvetica, Arial, sans-serif" letter-spacing="1.6">
    <text x="684" y="218" font-size="13" fill="#152A40" text-anchor="middle">Blynk IoT</text>
    <text x="684" y="238" font-size="10" fill="#8E8E82" text-anchor="middle">LIVE MONITORING</text>
  </g>
  <line x1="612" y1="290" x2="684" y2="290" stroke="#C9C2B4" stroke-width="1.2"/>
  <line x1="684" y1="290" x2="684" y2="260" stroke="#C9C2B4" stroke-width="1.2"/>

  <!-- phone / SMS -->
  <rect x="644" y="330" width="80" height="128" rx="8" fill="#FFFFFF" stroke="#152A40" stroke-width="1.4"/>
  <line x1="644" y1="352" x2="724" y2="352" stroke="#E2DED4" stroke-width="1.2"/>
  <rect x="658" y="366" width="52" height="9" fill="#E2DED4"/>
  <rect x="658" y="382" width="40" height="9" fill="#E2DED4"/>
  <rect x="658" y="404" width="52" height="9" fill="#A35318"/>
  <rect x="658" y="420" width="34" height="9" fill="#A35318"/>
  <line x1="684" y1="330" x2="684" y2="300" stroke="#C9C2B4" stroke-width="1.2"/>
  <text x="684" y="482" font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="1.6" fill="#8E8E82" text-anchor="middle">GPS + GSM  SMS</text>

  <!-- panic button -->
  <circle cx="400" cy="424" r="18" fill="#A35318"/>
  <circle cx="400" cy="424" r="27" fill="none" stroke="#A35318" stroke-width="1.2" opacity="0.5"/>
  <text x="400" y="478" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.8" fill="#A35318" text-anchor="middle">EMERGENCY BUTTON</text>

  <!-- caption rule -->
  <line x1="86" y1="536" x2="714" y2="536" stroke="#D8D2C6" stroke-width="1"/>
  <text x="86" y="560" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2.4" fill="#8E8E82">WEARABLE WOMEN SAFETY DEVICE</text>
</svg>
